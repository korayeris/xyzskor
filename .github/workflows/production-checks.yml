name: Production checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Product and security checks
        run: node scripts/check.mjs
      - name: Critical Node QA
        run: |
          npm run qa:general-home
          npm run qa:supabase-lazy
          npm run qa:football-ia
          npm run qa:demand-scope
          npm run qa:league-contract
          npm run qa:matchday
          npm run qa:live-architecture
          npm run qa:live-quota
          npm run qa:hardening
          npm run qa:weekly-football
          npm run qa:weekly-load
      - name: PostgreSQL migration, rollback and RLS QA
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run qa:db
      - name: Production build
        run: node scripts/build.mjs
