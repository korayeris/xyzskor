name: Production checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Product and security checks
        run: node scripts/check.mjs
      - name: Critical Node QA
        run: |
          npm run qa:general-home
          npm run qa:supabase-lazy
          npm run qa:football-ia
          npm run qa:demand-scope
          npm run qa:multisport-recovery
          npm run qa:league-contract
          npm run qa:matchday
          npm run qa:live-architecture
          npm run qa:live-quota
          npm run qa:hardening
          npm run qa:weekly-football
          npm run qa:weekly-load
      - name: PostgreSQL migration, rollback and RLS QA
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run qa:db
      - name: Production build
        run: node scripts/build.mjs
      - name: Install Chromium for production artifact QA
        run: npx playwright install --with-deps chromium
      - name: Production artifact QA
        run: |
          npm run qa:metadata
          npm run qa:a11y
          npm run qa:focus
          npm run qa:dist
